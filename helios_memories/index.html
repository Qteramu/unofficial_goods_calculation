<header><div class="hero"><div class="eyebrow">HELIOS RISING HEROES</div><h1>HELIOS MEMORIES</h1><p class="subtitle">GOODS LIST & PRICE CALCULATOR</p></div></header>
<main>

<section class="summary">
 <div class="summarytop"><div><div class="sumlabel">TOTAL PRICE</div><div class="total" id="grandTotal">¥0</div><div id="giftStatus" class="giftstatus pending">5,000円以上でショッピングバッグ付き</div></div><div class="sumright"><div class="sumlabel">TOTAL ITEMS</div><div class="count" id="totalCount">0点</div></div></div>

</section>

const PRODUCTS = [{"id": "aurora_key", "name": "オーロラアクリルキーホルダー", "price": 1320, "kind": "normal"}, {"id": "trump", "name": "トランプ", "price": 2750, "kind": "normal"}, {"id": "aroma", "name": "アロマキャンドル", "price": 1650, "kind": "normal"}, {"id": "emergency", "name": "エマージェンシーセット", "price": 3850, "kind": "normal"}, {"id": "shopping_bag", "name": "ショッピングバッグ", "price": 550, "kind": "normal"}, {"id": "after_story", "name": "After Storyアクリルスタンド", "price": 1980, "kind": "variants", "variants": ["鳳アキラ", "ウィル・スプラウト", "ブラッド・ビームス", "オスカー・ベイル", "如月レン", "ガスト・アドラー", "ヴィクター・ヴァレンタイン", "マリオン・ブライス", "レオナルド・ライト・Jr", "フェイス・ビームス", "キース・マックス", "ディノ・アルバーニ", "グレイ・リヴァース", "ビリー・ワイズ", "ジェイ・キッドマン", "アッシュ・オルブライト", "セイジ・スカイフォール", "ニコ", "ジュード・アレス", "ビアンキ・ロウ"]}, {"id": "big_photo", "name": "キラキラビッグフォト", "price": 880, "kind": "variants", "variants": ["鳳アキラ", "ウィル・スプラウト", "ブラッド・ビームス", "オスカー・ベイル", "如月レン", "ガスト・アドラー", "ヴィクター・ヴァレンタイン", "マリオン・ブライス", "レオナルド・ライト・Jr", "フェイス・ビームス", "キース・マックス", "ディノ・アルバーニ", "グレイ・リヴァース", "ビリー・ワイズ", "ジェイ・キッドマン", "アッシュ・オルブライト", "セイジ・スカイフォール", "ニコ", "ジュード・アレス", "ビアンキ・ロウ"]}, {"id": "art_panel", "name": "アクリルアートパネル", "price": 2750, "kind": "variants", "variants": ["The Break", "The Nostalgia", "The Sunrise"]}, {"id": "acrylic_stand", "name": "アクリルスタンド", "price": 1700, "kind": "variants", "variants": ["テオ・ジョルノ", "レオナルド・ライト アカデミーver.", "ハーヴィー・アドラー アカデミーver.", "シリウス・フィンチ", "オズワルド・サマーフィールド"]}, {"id": "museum_stand", "name": "復刻アクリルスタンド", "price": 1700, "kind": "variants", "variants": ["クリス", "レオナルド・ライト", "ロビン・グッドウェザー", "リヒト", "ハーヴィー・アドラー", "ルカ", "カイ", "ジェット"]}, {"id": "patch", "name": "ワッペンシール", "price": 990, "kind": "variants", "variants": ["サウスセクター", "ノースセクター", "ウエストセクター", "イーストセクター", "12th Robins"]}, {"id": "badge_collection", "name": "キャラバッジコレクション Close-up", "kind": "random_group", "variants": [{"name": "\"Akira\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Will\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Brad\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Oscar\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Ren\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Gast\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Victor\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Marion\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Jr.\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Faith\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Keith\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Dino\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Gray\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Billy\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Jay\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Asch\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Sage\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Nico\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Jude\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}, {"name": "\"Bianchi\"", "price": 550, "boxPrice": 3300, "boxCount": 6, "note": "全6種"}]}, {"id": "clear_collection", "name": "メモリアルクリアカードコレクション", "kind": "random_group", "variants": [{"name": "Select South sector", "price": 550, "boxPrice": 4400, "boxCount": 8, "note": "全16種"}, {"name": "Select North sector", "price": 550, "boxPrice": 4400, "boxCount": 8, "note": "全16種"}, {"name": "Select West sector", "price": 550, "boxPrice": 4400, "boxCount": 8, "note": "全16種"}, {"name": "Select East sector", "price": 550, "boxPrice": 4400, "boxCount": 8, "note": "全16種"}, {"name": "Select 12th Robins", "price": 550, "boxPrice": 4400, "boxCount": 8, "note": "全16種"}]}, {"id": "marker_collection", "name": "マルチマーカーコレクション", "kind": "random_group", "variants": [{"name": "サウスセクター", "price": 660, "boxPrice": 5280, "boxCount": 8, "note": "全8種"}, {"name": "ノースセクター", "price": 660, "boxPrice": 5280, "boxCount": 8, "note": "全8種"}, {"name": "ウエストセクター", "price": 660, "boxPrice": 5280, "boxCount": 8, "note": "全8種"}, {"name": "イーストセクター", "price": 660, "boxPrice": 5280, "boxCount": 8, "note": "全8種"}, {"name": "12th Robins", "price": 660, "boxPrice": 5280, "boxCount": 8, "note": "全8種"}, {"name": "【イクリプス】", "price": 660, "boxPrice": 3960, "boxCount": 6, "note": "全6種"}]}];
const STORE_KEY = "helios_memories_goods_v2";
const HEROES = [
 {name:"鳳アキラ",label:"アキラ",alias:"Akira"},
 {name:"ウィル・スプラウト",label:"ウィル",alias:"Will"},
 {name:"ブラッド・ビームス",label:"ブラッド",alias:"Brad"},
 {name:"オスカー・ベイル",label:"オスカー",alias:"Oscar"},
 {name:"如月レン",label:"レン",alias:"Ren"},
 {name:"ガスト・アドラー",label:"ガスト",alias:"Gast"},
 {name:"ヴィクター・ヴァレンタイン",label:"ヴィクター",alias:"Victor"},
 {name:"マリオン・ブライス",label:"マリオン",alias:"Marion"},
 {name:"レオナルド・ライト・Jr",label:"Jr.",alias:"Jr."},
 {name:"フェイス・ビームス",label:"フェイス",alias:"Faith"},
 {name:"キース・マックス",label:"キース",alias:"Keith"},
 {name:"ディノ・アルバーニ",label:"ディノ",alias:"Dino"},
 {name:"グレイ・リヴァース",label:"グレイ",alias:"Gray"},
 {name:"ビリー・ワイズ",label:"ビリー",alias:"Billy"},
 {name:"ジェイ・キッドマン",label:"ジェイ",alias:"Jay"},
 {name:"アッシュ・オルブライト",label:"アッシュ",alias:"Asch"},
 {name:"セイジ・スカイフォール",label:"セイジ",alias:"Sage"},
 {name:"ニコ",label:"ニコ",alias:"Nico"},
 {name:"ジュード・アレス",label:"ジュード",alias:"Jude"},
 {name:"ビアンキ・ロウ",label:"ビアンキ",alias:"Bianchi"}
];
const SECTORS = [
 {key:"south",name:"サウス",full:"サウスセクター",english:"South sector",members:["鳳アキラ","ウィル・スプラウト","ブラッド・ビームス","オスカー・ベイル"]},
 {key:"north",name:"ノース",full:"ノースセクター",english:"North sector",members:["如月レン","ガスト・アドラー","ヴィクター・ヴァレンタイン","マリオン・ブライス"]},
 {key:"west",name:"ウエスト",full:"ウエストセクター",english:"West sector",members:["レオナルド・ライト・Jr","フェイス・ビームス","キース・マックス","ディノ・アルバーニ"]},
 {key:"east",name:"イースト",full:"イーストセクター",english:"East sector",members:["グレイ・リヴァース","ビリー・ワイズ","ジェイ・キッドマン","アッシュ・オルブライト"]},
 {key:"12th",name:"12th Robins",full:"12th Robins",english:"12th Robins",members:["セイジ・スカイフォール","ニコ","ジュード・アレス","ビアンキ・ロウ"]}
];
let selectedTabs = new Set(); // 初期表示は全商品
const yen = n => "¥" + Number(n||0).toLocaleString("ja-JP");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = {qty:{}, budget:""};
try { const saved=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(saved&&saved.qty) state=saved; } catch(e){}
function key(id,suffix){return id+"__"+suffix}
function lineQty(id,suffix){return Math.max(0,parseInt(state.qty[key(id,suffix)]||0,10)||0)}
function visibleIndices(p){
 if(selectedTabs.size===0) return null; // 選択なし＝全商品
 if(p.kind==="normal") return selectedTabs.has("common") ? null : [];
 const visible = new Set();
 selectedTabs.forEach(tab=>{
  if(tab==="common"){
   if(p.kind==="variants"){
    p.variants.forEach((v,i)=>{
     if(p.id!=="patch" && !HEROES.some(h=>h.name===v)) visible.add(i);
    });
   }
   return;
  }
  const sector=SECTORS.find(s=>s.key===tab);
  if(sector){
   if(p.kind==="variants" && p.id==="patch"){
    p.variants.forEach((v,i)=>{if(v===sector.full)visible.add(i);});
   }else if(p.kind==="variants"){
    p.variants.forEach((v,i)=>{if(sector.members.includes(v))visible.add(i);});
   }else if(p.kind==="random_group" && p.id==="badge_collection"){
    p.variants.forEach((v,i)=>{
     if(sector.members.some(member=>HEROES.find(h=>h.name===member)?.alias===v.name.replace(/"/g,""))) visible.add(i);
    });
   }else if(p.kind==="random_group" && p.id==="clear_collection"){
    p.variants.forEach((v,i)=>{if(v.name===`Select ${sector.english}`)visible.add(i);});
   }else if(p.kind==="random_group" && p.id==="marker_collection"){
    p.variants.forEach((v,i)=>{if(v.name===sector.full)visible.add(i);});
   }
   return;
  }
  const hero=HEROES.find(h=>h.name===tab);
  if(hero){
   if(p.kind==="variants") p.variants.forEach((v,i)=>{if(v===hero.name)visible.add(i);});
   if(p.kind==="random_group" && p.id==="badge_collection"){
    p.variants.forEach((v,i)=>{if(v.name===`"${hero.alias}"`)visible.add(i);});
   }
  }
 });
 return [...visible];
}
function productTotals(p, indices=null){
 let amount=0,count=0;
 if(p.kind==="variants"){
  const use=indices===null?p.variants.map((_,i)=>i):indices;
  use.forEach(i=>{let q=lineQty(p.id,"v"+i);amount+=q*p.price;count+=q;});
 }else if(p.kind==="random_group"){
  const use=indices===null?p.variants.map((_,i)=>i):indices;
  use.forEach(i=>{const v=p.variants[i];let q=lineQty(p.id,"v"+i+"_pack"),b=lineQty(p.id,"v"+i+"_box");amount+=q*v.price+b*v.boxPrice;count+=q+b*v.boxCount;});
 }else{
  let q=lineQty(p.id,"main");amount=q*p.price;count=q;
 }
 return {amount,count};
}
function makeQty(id,suffix,q){
 return `<div class="qty"><button aria-label="1個減らす" data-id="${id}" data-suffix="${suffix}" data-delta="-1">−</button><input aria-label="個数" type="number" min="0" step="1" value="${q}" data-id="${id}" data-suffix="${suffix}"><button aria-label="1個増やす" data-id="${id}" data-suffix="${suffix}" data-delta="1">＋</button></div>`;
}
function render(){
 const openedProducts = new Set([...document.querySelectorAll("#catalog details[open]")].map(el=>el.dataset.product));
 const tabs=[
  {key:"all",label:"すべて"},
  {key:"common",label:"共通商品"},
  ...SECTORS.map(s=>({key:s.key,label:s.name,title:s.full})),
  ...HEROES.map(h=>({key:h.name,label:h.label,title:h.name}))
 ];
 document.getElementById("tabbar").innerHTML=tabs.map(t=>{
  const active=t.key==="all" ? selectedTabs.size===0 : selectedTabs.has(t.key);
  return `<button class="tabbtn${active?" active":""}" data-tab="${esc(t.key)}" aria-pressed="${active}" ${t.title?`title="${esc(t.title)}"`:""}>${esc(t.label)}</button>`;
 }).join("");
 if(selectedTabs.size===0){
  document.getElementById("tabcaption").textContent="全商品を表示中";
 }else{
  const labels=[...selectedTabs].map(key=>{
   if(key==="common")return "共通商品";
   const sector=SECTORS.find(s=>s.key===key);if(sector)return sector.name;
   const hero=HEROES.find(h=>h.name===key);if(hero)return hero.label;
   return key;
  });
  document.getElementById("tabcaption").textContent=`選択中：${labels.join("・")}`;
 }
 const groups=[["通常商品","normal"],["種類あり商品","variants"],["ランダム商品","random_group"]];
 let html="",visibleCount=0;
 groups.forEach(([title,kind])=>{
  const groupProducts=PRODUCTS.filter(p=>p.kind===kind).map(p=>({p,indices:visibleIndices(p)})).filter(x=>x.indices===null||x.indices.length>0);
  if(!groupProducts.length)return;
  html+=`<div class="section">${title}<small>${kind==="normal"?"単価固定":kind==="variants"?"種類ごとに個数入力":"種類ごとに単品・BOXを管理"}</small></div>`;
  groupProducts.forEach(({p,indices})=>{
   visibleCount++;
   const t=productTotals(p,indices);let body="";
   if(kind==="normal"){
    body=`<div class="variantrow"><div class="variantname">購入数</div><div class="unit">${yen(p.price)} / 個</div>${makeQty(p.id,"main",lineQty(p.id,"main"))}</div>`;
   }else if(kind==="variants"){
    const shownIndices=indices===null?p.variants.map((_,i)=>i):indices;
    body=shownIndices.map(i=>{const v=p.variants[i];return `<div class="variantrow"><div class="variantname">${esc(v)}</div><div class="unit">${yen(p.price)}</div>${makeQty(p.id,"v"+i,lineQty(p.id,"v"+i))}</div>`;}).join("");
   }else{
    const shownIndices=indices===null?p.variants.map((_,i)=>i):indices;
    body=shownIndices.map(i=>{const v=p.variants[i];return `<div class="randomtype"><div class="randomtypehead"><div class="variantname">${esc(v.name)}</div><div class="unit">${esc(v.note||"")}</div></div><div class="randomcontrols"><div class="randombuy"><div class="buylabel">単品<small>${yen(v.price)} / パック</small></div>${makeQty(p.id,"v"+i+"_pack",lineQty(p.id,"v"+i+"_pack"))}</div><div class="randombuy"><div class="buylabel">BOX<small>${yen(v.boxPrice)} / ${v.boxCount}点入り</small></div>${makeQty(p.id,"v"+i+"_box",lineQty(p.id,"v"+i+"_box"))}</div></div></div>`;}).join("");
   }
   const meta=kind==="random_group"?"種類別に入力":yen(p.price);
   html+=`<details class="product" data-product="${p.id}"><summary class="prodhead"><span class="prodname">${esc(p.name)}</span><span class="prodmeta">${meta}</span><span class="subtotal">${yen(t.amount)}</span></summary><div class="prodbody">${body}</div></details>`;
  });
 });
 if(!visibleCount) html='<div class="emptyhint">このタブに表示できる商品はありません。</div>';
 document.getElementById("catalog").innerHTML=html;
 document.querySelectorAll("#catalog details[data-product]").forEach(el=>{if(openedProducts.has(el.dataset.product))el.open=true;});
 document.getElementById("budget").value=state.budget||"";
 updateSummary();
}
function updateSummary(){
 let amount=0,count=0;
 PRODUCTS.forEach(p=>{let t=productTotals(p);amount+=t.amount;count+=t.count;const el=document.querySelector(`[data-product="${p.id}"] .subtotal`);if(el)el.textContent=yen(t.amount);});
 document.getElementById("grandTotal").textContent=yen(amount);
 document.getElementById("totalCount").textContent=count.toLocaleString("ja-JP")+"点";
 const giftStatus=document.getElementById("giftStatus");
 if(amount>=5000){
  giftStatus.textContent="🎁 ショッピングバッグ付き！";
  giftStatus.className="giftstatus eligible";
 }else{
  giftStatus.textContent="5,000円以上でショッピングバッグ付き";
  giftStatus.className="giftstatus pending";
 }
 const b=Number(state.budget),status=document.getElementById("budgetState");
 if(state.budget===""||!Number.isFinite(b)||b<=0){status.textContent="予算未設定";status.classList.remove("over");}
 else if(amount>b){status.textContent="予算を"+yen(amount-b)+"超過";status.classList.add("over");}
 else{status.textContent="予算残り "+yen(b-amount);status.classList.remove("over");}
}
document.getElementById("tabbar").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-tab]");if(!btn)return;
 const key=btn.dataset.tab;
 if(key==="all"){
  selectedTabs.clear();
 }else{
  if(selectedTabs.has(key)) selectedTabs.delete(key);
  else selectedTabs.add(key);
 }
 render();
});
document.getElementById("catalog").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-delta]");if(!btn)return;
 const k=key(btn.dataset.id,btn.dataset.suffix);
 state.qty[k]=Math.max(0,lineQty(btn.dataset.id,btn.dataset.suffix)+Number(btn.dataset.delta));
 save();render();
});
document.getElementById("catalog").addEventListener("change",e=>{
 if(e.target.matches("input[data-id]")){const el=e.target,k=key(el.dataset.id,el.dataset.suffix);state.qty[k]=Math.max(0,parseInt(el.value||0,10)||0);save();render();}
});
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
document.getElementById("budget").addEventListener("input",e=>{state.budget=e.target.value;save();updateSummary();});
function selectedLines(){
 const out=[];
 PRODUCTS.forEach(p=>{
  if(p.kind==="normal"){let q=lineQty(p.id,"main");if(q)out.push({name:p.name,detail:`${q}個`,amount:q*p.price,count:q});}
  if(p.kind==="variants")p.variants.forEach((v,i)=>{let q=lineQty(p.id,"v"+i);if(q)out.push({name:p.name,detail:`${v}：${q}個`,amount:q*p.price,count:q});});
  if(p.kind==="random_group")p.variants.forEach((v,i)=>{let q=lineQty(p.id,"v"+i+"_pack"),b=lineQty(p.id,"v"+i+"_box");if(q)out.push({name:p.name,detail:`${v.name}／単品 ${q}パック`,amount:q*v.price,count:q});if(b)out.push({name:p.name,detail:`${v.name}／BOX ${b}個（${b*v.boxCount}点分）`,amount:b*v.boxPrice,count:b*v.boxCount});});
 });
 return out;
}
function reportText(){
 const lines=selectedLines(),total=lines.reduce((s,x)=>s+x.amount,0),count=lines.reduce((s,x)=>s+x.count,0);
 return ["HELIOS MEMORIES ～エリオスメモリーズ～","購入予定リスト","",...(lines.length?lines.map(x=>`・${x.name}／${x.detail}／${yen(x.amount)}`):["（商品未選択）"]),"",`合計点数：${count}点`,`合計金額：${yen(total)}`,state.budget?`予算：${yen(state.budget)}`:"予算：未設定"].join("\n");
}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert("コピーしました！");}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();alert("コピーしました！");}}
document.getElementById("copyList").addEventListener("click",()=>copyText(reportText()));
document.getElementById("backup").addEventListener("click",()=>{
 const rows=["HELIOS_MEMORIES_BACKUP_V2",`budget\t${state.budget||""}`,...Object.entries(state.qty).map(([k,v])=>`qty\t${k}\t${v}`)];
 const blob=new Blob([rows.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="HELIOS_MEMORIES_backup.txt";a.click();URL.revokeObjectURL(url);
});
document.getElementById("restore").addEventListener("click",()=>document.getElementById("restoreFile").click());
document.getElementById("restoreFile").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const txt=await f.text(),rows=txt.split(/\r?\n/);if(!["HELIOS_MEMORIES_BACKUP_V1","HELIOS_MEMORIES_BACKUP_V2"].includes(rows[0].trim()))throw Error("形式が違います");
  const next={qty:{},budget:""};rows.slice(1).forEach(row=>{const c=row.split("\t");if(c[0]==="budget")next.budget=c[1]||"";if(c[0]==="qty"&&c.length>=3)next.qty[c[1]]=Math.max(0,parseInt(c[2],10)||0);});
  state=next;save();render();alert("バックアップを復元しました！");
 }catch(err){alert("バックアップを読み込めませんでした。");}e.target.value="";
});
document.getElementById("reset").addEventListener("click",()=>{if(confirm("入力した個数と予算をすべてリセットしますか？")){state={qty:{},budget:""};selectedTabs.clear();save();render();}});
render();
</script>
</body></html>
